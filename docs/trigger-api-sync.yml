# ============================================================================
#  REFERANS KOPYA - bu dosya "RYucel/kktc_tufe" deposuna KURULMUŞTUR.
#  Canlı konumu: kktc_tufe/.github/workflows/trigger-api-sync.yml
#
#  Ne yapar: Kaynak depoda veri değiştiğinde (elle yüklenen GRETL_TUFE.csv
#  veya cron'un çektiği docs/data/tufe.json) bu API deposuna
#  repository_dispatch gönderir; API günlük cron'u beklemeden senkronize
#  olur. Gecikme 2-8 saatten ~1 dakikaya iner.
#
#  Yetkilendirme: kaynak depodaki API_REPO_DISPATCH_TOKEN secret'i,
#  yalnızca kktc_tufe_api deposuna "Contents: Read and write" izni verilmiş
#  ince ayarlı bir token tutar. POST /repos/.../dispatches ucunun
#  gerektirdiği tek izin budur.
#
#  Bu tetikleyici çalışmazsa veri kaybı olmaz: API'nin günlük 20:00 UTC
#  cron'u yedek olarak devrede kalır, yalnızca gecikme geri gelir.
# ============================================================================

name: TÜFE API'sini Tetikle

on:
  push:
    branches: [main]
    paths:
      # Elle yüklenen sepet fiyatları
      - "GRETL_TUFE.csv"
      # Bu deponun cron'u resmî siteden yeni TÜFE çektiğinde
      - "docs/data/tufe.json"
  workflow_dispatch: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: TUFE_API deposunda senkronizasyonu başlat
        env:
          GH_TOKEN: ${{ secrets.API_REPO_DISPATCH_TOKEN }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/RYucel/kktc_tufe_api/dispatches \
            -f event_type=csv-updated \
            -f 'client_payload[source]=kktc_tufe/GRETL_TUFE.csv' \
            -f "client_payload[commit]=${{ github.sha }}"
