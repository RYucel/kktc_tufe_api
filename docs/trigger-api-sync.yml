# ============================================================================
#  BU DOSYA "RYucel/kktc_tufe" DEPOSUNA KOPYALANACAKTIR.
#  Hedef konum: .github/workflows/trigger-api-sync.yml
#
#  Amaç: Bu depodaki veri her güncellendiğinde (elle yüklenen GRETL_TUFE.csv
#        veya cron'un çektiği docs/data/tufe.json) TUFE_API deposunu ANINDA
#        tetikler; API bir sonraki günlük cron'u beklemeden yayına alınır.
#
#  KURULUM (tek seferlik):
#   1. https://github.com/settings/personal-access-tokens adresinden
#      "Fine-grained token" oluşturun:
#        - Repository access: yalnızca "RYucel/kktc_tufe_api"
#        - Permissions -> Repository permissions -> Contents: Read and write
#      (Klasik token kullanacaksanız "repo" kapsamı yeterlidir.)
#   2. Token'ı "RYucel/kktc_tufe" deposunda
#      Settings -> Secrets and variables -> Actions -> New repository secret
#      adı: API_REPO_DISPATCH_TOKEN
#   3. Bu dosyayı yukarıdaki konuma ekleyip commit'leyin.
#
#  Bu kurulum YAPILMAZSA da sistem çalışır: TUFE_API her gün 15:00 UTC'de
#  CSV'yi kontrol eder. Dispatch yalnızca gecikmeyi ~24 saatten ~1 dakikaya indirir.
# ============================================================================

name: TÜFE API'sini Tetikle

on:
  push:
    branches: [main]
    paths:
      # Elle yüklenen sepet fiyatları
      - "GRETL_TUFE.csv"
      # Bu deponun cron'u resmî siteden yeni TÜFE çektiğinde
      - "docs/data/tufe.json"
  workflow_dispatch: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: TUFE_API deposunda senkronizasyonu başlat
        env:
          GH_TOKEN: ${{ secrets.API_REPO_DISPATCH_TOKEN }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/RYucel/kktc_tufe_api/dispatches \
            -f event_type=csv-updated \
            -f 'client_payload[source]=kktc_tufe/GRETL_TUFE.csv' \
            -f "client_payload[commit]=${{ github.sha }}"
