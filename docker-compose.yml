services:
  tufe-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kktc_tufe_api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      # Kendi rastgele anahtarinizi verin (orn: openssl rand -hex 32).
      # Tanimlanmazsa POST /api/v1/sync kapali kalir.
      - API_KEY=${API_KEY:-}
      - CRON_SCHEDULE=0 9 1-10 * *
      - RATE_LIMIT_MAX=120
    volumes:
      # Veri dosyalarının konteyner yeniden başlasa da kalıcı olması için volume
      - ./data:/app/data
